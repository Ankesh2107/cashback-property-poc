<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cashback Property{% endblock %}</title>
<style>
:root {
  --bg: #f1f5f9; --surface: #fff; --text: #1e293b; --muted: #64748b;
  --border: #e2e8f0; --primary: #2563eb; --primary-light: #dbeafe;
  --success: #059669; --success-light: #d1fae5;
  --warning: #d97706; --warning-light: #fef3c7;
  --danger: #dc2626; --danger-light: #fee2e2;
  --sidebar-bg: #0f172a; --sidebar-text: #94a3b8; --sidebar-active: #fff;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

.sidebar { width: 240px; background: var(--sidebar-bg); color: var(--sidebar-text);
           padding: 0; flex-shrink: 0; position: fixed; top: 0; left: 0; bottom: 0;
           overflow-y: auto; z-index: 100; }
.sidebar .logo { padding: 24px 20px 20px; border-bottom: 1px solid #1e293b; }
.sidebar .logo h2 { color: #fff; font-size: 18px; font-weight: 700; }
.sidebar .logo span { font-size: 12px; color: var(--sidebar-text); }
.sidebar nav { padding: 12px 0; }
.sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 10px 20px;
                 color: var(--sidebar-text); font-size: 14px; transition: all .15s; }
.sidebar nav a:hover { background: #1e293b; color: #fff; text-decoration: none; }
.sidebar nav a.active { background: var(--primary); color: #fff; }
.sidebar nav a .badge { background: #334155; color: #94a3b8; font-size: 11px;
                        padding: 2px 7px; border-radius: 10px; margin-left: auto; }
.sidebar nav a.active .badge { background: rgba(255,255,255,.2); color: #fff; }
.sidebar .divider { height: 1px; background: #1e293b; margin: 8px 16px; }

.main { margin-left: 240px; flex: 1; padding: 28px 32px; min-width: 0; }
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 24px; font-weight: 700; }
.page-header p { color: var(--muted); margin-top: 4px; font-size: 14px; }

.flash { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 14px; }
.flash-success { background: var(--success-light); color: #065f46; }
.flash-error { background: var(--danger-light); color: #991b1b; }
.flash-info { background: var(--primary-light); color: #1e40af; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 20px; margin-bottom: 16px; }
.card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
             margin-bottom: 24px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 16px 18px; }
.stat .value { font-size: 28px; font-weight: 700; color: var(--text); }
.stat .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
.stat.primary .value { color: var(--primary); }
.stat.success .value { color: var(--success); }
.stat.warning .value { color: var(--warning); }
.stat.danger .value { color: var(--danger); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 12px; background: #f8fafc; border-bottom: 2px solid var(--border);
     font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: #f8fafc; }

.badge-status { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px;
                font-weight: 600; }
.badge-ELIGIBLE_FOR_DRAFT { background: var(--success-light); color: #065f46; }
.badge-HOLD_REVIEW { background: var(--warning-light); color: #92400e; }
.badge-SUPPRESSED { background: var(--danger-light); color: #991b1b; }
.badge-INVALID { background: #f1f5f9; color: #475569; }
.badge-INTERESTED { background: var(--success-light); color: #065f46; }
.badge-QUESTION { background: var(--primary-light); color: #1e40af; }
.badge-NOT_NOW { background: var(--warning-light); color: #92400e; }
.badge-UNSUBSCRIBE { background: var(--danger-light); color: #991b1b; }
.badge-OUT_OF_OFFICE { background: #f1f5f9; color: #475569; }
.badge-WRONG_PERSON { background: #fdf2f8; color: #9d174d; }
.badge-NEEDS_REVIEW { background: #fef3c7; color: #92400e; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
       border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer;
       transition: all .15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #047857; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: #f8fafc; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.tab { padding: 7px 14px; border-radius: 8px; font-size: 13px; color: var(--muted);
       font-weight: 500; transition: all .15s; }
.tab:hover { background: var(--surface); color: var(--text); text-decoration: none; }
.tab.active { background: var(--primary); color: #fff; }
.tab .count { font-size: 11px; margin-left: 4px; opacity: .7; }

.email-preview { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius);
                 padding: 20px; font-family: Georgia, serif; font-size: 14px; line-height: 1.7; }
.email-preview .subject { font-family: -apple-system, sans-serif; font-weight: 700;
                          margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.email-preview pre { white-space: pre-wrap; font-family: inherit; margin: 0; }

.scenario-card { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px;
                 overflow: hidden; }
.scenario-header { padding: 12px 16px; background: #f8fafc; cursor: pointer; display: flex;
                   align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.scenario-header:hover { background: #f1f5f9; }
.scenario-header .arrow { transition: transform .2s; font-size: 12px; margin-left: auto; color: var(--muted); }
.scenario-header.open .arrow { transform: rotate(90deg); }
.scenario-body { padding: 16px; display: none; border-top: 1px solid var(--border); }
.scenario-body.open { display: block; }
.scenario-incoming { background: #fef3c7; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px;
                     font-style: italic; font-size: 13px; }
.scenario-incoming strong { font-style: normal; display: block; margin-bottom: 4px; font-size: 12px;
                            color: var(--muted); }

.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 48px;
               text-align: center; transition: all .2s; cursor: pointer; }
.upload-zone:hover { border-color: var(--primary); background: var(--primary-light); }
.upload-zone h3 { margin-bottom: 8px; }
.upload-zone p { color: var(--muted); font-size: 14px; }
.upload-zone input[type=file] { display: none; }

.loading { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border);
           border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.info-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 16px; font-size: 14px; }
.info-grid dt { color: var(--muted); font-weight: 500; }
.info-grid dd { font-weight: 500; }

.bar-chart .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.bar-chart .bar-label { width: 160px; text-align: right; color: var(--muted); flex-shrink: 0; }
.bar-chart .bar-fill { height: 20px; border-radius: 4px; min-width: 4px; transition: width .6s ease; }
.bar-chart .bar-value { font-weight: 600; width: 40px; }

.progress-stacked { display: flex; height: 36px; border-radius: 8px; overflow: hidden;
                    background: var(--border); margin-bottom: 12px; }
.progress-segment { display: flex; align-items: center; justify-content: center; color: #fff;
                    font-size: 13px; font-weight: 700; transition: width .8s ease;
                    min-width: 0; overflow: hidden; white-space: nowrap; }
.progress-segment:first-child { border-radius: 8px 0 0 8px; }
.progress-segment:last-child { border-radius: 0 8px 8px 0; }
.progress-segment:only-child { border-radius: 8px; }
.progress-legend { display: flex; flex-wrap: wrap; gap: 16px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.legend-item i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend-item b { color: var(--text); font-weight: 600; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 16px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">
    <h2>Cashback Property</h2>
    <span>Automation PoC</span>
  </div>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
      <span>Dashboard</span>
    </a>
    <a href="{{ url_for('upload') }}" class="{% if request.endpoint == 'upload' %}active{% endif %}">
      <span>Upload Data</span>
    </a>
    <div class="divider"></div>
    <a href="{{ url_for('leads') }}" class="{% if request.endpoint in ('leads','lead_detail') %}active{% endif %}">
      <span>Leads</span>
    </a>
    <a href="{{ url_for('drafts') }}" class="{% if request.endpoint == 'drafts' %}active{% endif %}">
      <span>Draft Queue</span>
    </a>
    <a href="{{ url_for('events_page') }}" class="{% if request.endpoint == 'events_page' %}active{% endif %}">
      <span>Reply Events</span>
    </a>
    <a href="{{ url_for('audit_log') }}" class="{% if request.endpoint == 'audit_log' %}active{% endif %}">
      <span>Audit Log</span>
    </a>
    <div class="divider"></div>
    <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">
      <span>Settings</span>
    </a>
  </nav>
</aside>
<main class="main">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash flash-{{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
