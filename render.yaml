databases:
  - name: cashback-db
    plan: free
    databaseName: cashback
    user: cashback

services:
  - type: web
    name: cashback-property-poc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET
        generateValue: true
      - key: AUTO_LOAD_SAMPLE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: cashback-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
